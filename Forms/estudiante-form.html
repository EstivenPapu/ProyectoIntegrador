<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sgc</title>
    <link rel="stylesheet" href="../Estilos/style-form.css">
</head>

<body>
    <div class="container-form">
        <form class="formulario">
            <div class="header-form">
                <h2>CREAR ESTUDIANTE</h2>
            </div>
            <div class="form-group">
                <label for="name">Nombre:</label>
                <input type="text" name="name" placeholder="Ejemplo: Juan">
            </div>
            <div class="form-group">
                <label for="lastName">Apellido:</label>
                <input type="text" name="lastName" placeholder="Ejemplo: Pérez">
            </div>
            <div class="form-group">
                <label for="email">Correo electrónico:</label>
                <input type="email" name="email" placeholder="Ejemplo: juanperez@example.com">
            </div>
            <div class="form-group">
                <label for="phone">Teléfono:</label>
                <input type="tel" name="phone" placeholder="Ejemplo: 123-456-7890">
            </div>
            <div class="btn-form">
                <button>Enviar</button>
                <button><a href="../Estudiantes.html">Cancelar</a></button>
            </div>

        </form>
    </div>

</body>

</html>
