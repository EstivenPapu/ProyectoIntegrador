<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sgc</title>
    <link rel="stylesheet" href="../Estilos/style-form.css">
    <link rel="stylesheet" href="../Estilos/style-form-estudiante.css">
</head>

<body>
    <div class="container-form">
        <h1 class="header-for">SISTEMA DE GESTION DE CURSOS</h1>
        <form class="formulario">
            <div class="header-form">
                <h2>CREAR ESTUDIANTE</h2>
            </div>
            <div class="form-group">
                <label for="name">Nombre</label>
                <input type="text" name="name" required>
            </div>
            <div class="form-group">
                <label for="lastName">Apellido</label>
                <input type="text" name="lastName" required>
            </div>
            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input type="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="phone">Teléfono</label>
                <input type="tel" name="phone" required>
            </div>
            <div class="btn-form">
                <button>Enviar</button>
                <button><a href="../Estudiantes.html">Cancelar</a></button>
            </div>

        </form>
    </div>

</body>

</html>
