<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario matricula</title>
    <link rel="stylesheet" href="../Estilos/style-form.css">
    <link rel="stylesheet" href="../Estilos/style-form-matricula.css">
</head>
<body>
    <div class="container-form">

        <h1 class="header-form">Sistema de gestion de cursos</h1>
        
        <form class="formulario">
            <div class="header-form">
                <h2>CREAR CURSO</h2>
            </div>
            <div class="form-group">
                <label for="codigo">Codigo</label>
                <input type="text" name="codigo">
            </div>
            <div class="form-group">
                <label for="curso">Nombre del curso</label>
                <input type="text" name="curso">
            </div>
            <div class="form-group">
                <label for="descripcion">Descripcion</label>
                <textarea name="descripcion" class="texarea"></textarea>
            </div>
            <div class="form-group">
                <label for="capacidad">Capacidad maxima</label>
                <input type="number" name="capacidad">
            </div>
            <div class="btn-form">
                <button>Enviar</button> 
                <button><a href="../Cursos.html">Cancelar</a></button>
            </div>
        </form>
    </div>
</body>
</html>
