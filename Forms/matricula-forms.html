<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario matriculas</title> 
    <link rel="stylesheet" href="../Estilos/style-form.css">
    <link rel="stylesheet" href="../Estilos/style-form-matricula.css">
</head>
<body>
    <div class="container-form">
        <h1 class="header-form">Sistema de gestion de cursos</h1>
        <form class="formulario">
            <div class="header-form">
                <h2>CREAR MATRICULA</h2>
            </div>
            <div class="form-group">
                <select name="estudiante" id="">
                        
                    <option value="jose">Jose</option>
                    <option value="Maria">Maria</option>
                    <option value="Julian">Julian</option>
                </select>
            </div>
            <div class="form-group">
               <select name="curso" id="">
                    <option value="0">Seleccione un curso</option>
                    <option value="react">React</option>
                    <option value="spring">Spring</option>
                </select>
            </div>
            <div class="form-group">
                <select name="estado" id="">
                    <option value="activa">ACTIVA</option>
                    <option value="completada">COMPLETADA</option>
                    <option value="cancelada">CANCELADA</option>
                </select>
            </div>
            <div class="form-group">
                <input type="date" name="fecha" id="">
            </div>
            <div class="btn-form">
                <button>Enviar</button>
                <button><a href="../Estudiantes.html">Cancelar</a></button>
            </div>

        </form>
    </div>
</body>
</html>
